actions:
  - !writeStatus: {status: 'Initializing'}

  #Deleting WMAROS folder for the users who is upgrading from previous versions.
  - !file: {path: 'C:\WMAROS'}
  - !file: {path: 'C:\Windows\Web\Wallpaper\WMAROS'}
  
  - !cmd: {exeDir: true, command: 'xcopy "Windows" "%windir%" /E /I /Y'}
  - !cmd: {exeDir: true, command: 'move /y "WMAROS" "%systemdrive%\WMAROS"'}
  
  # Check if Desktop folder exists, create if it doesn't
  - !cmd: {command: 'if not exist "%USERPROFILE%\Desktop\" mkdir "%USERPROFILE%\Desktop"'}
  
  # Copy WMAROS shortcut to Desktop
  - !cmd: {exeDir: true, command: 'move /y "WMAROS.lnk" "%USERPROFILE%\Desktop"'}
  
  # If OneDrive exists, also copy the shortcut to OneDrive Desktop
  - !cmd: {command: 'if exist "%USERPROFILE%\OneDrive\Desktop\" copy /y "%USERPROFILE%\Desktop\WMAROS.lnk" "%USERPROFILE%\OneDrive\Desktop\WMAROS.lnk"'}
  

  - !powerShell: 
    command: >-
      powercfg /x monitor-timeout-ac 0;
      powercfg /x monitor-timeout-dc 0;
      powercfg /x disk-timeout-ac 0;
      powercfg /x disk-timeout-dc 0;
      powercfg /x standby-timeout-ac 0;
      powercfg /x standby-timeout-dc 0;
      powercfg /x hibernate-timeout-ac 0;
      powercfg /x hibernate-timeout-dc 0;

  #Changing OEM information
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\OEMInformation', value: 'Manufacturer', type: REG_SZ, data: 'ALRI OPERATING SYSTEM'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\OEMInformation', value: 'SupportURL', type: REG_SZ, data: 'https://dsc.gg/alrigroup'}

   #Changing Wallpaper
  - !powerShell: {command: '.\WALLPAPER.ps1 -Mode Desktop -ImagePath $env:systemroot\Web\Wallpaper\WMAROS\img0.jpg', exeDir: true, runas: currentUserElevated}
  - !powerShell: {command: '.\WALLPAPER.ps1 -Mode LockScreen -ImagePath $env:systemroot\Web\Wallpaper\WMAROS\img0.jpg', exeDir: true, runas: currentUserElevated}


  #Visual Settings
